<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Agent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Market Agent</h1>
    <form id="add-form" class="add-form">
      <input id="ticker-input" type="text" placeholder="Add ticker, e.g. NVDA" autocomplete="off" maxlength="10" />
      <button type="submit">Add</button>
    </form>
  </header>

  <main id="cards" class="cards" aria-live="polite">
    <!-- cards are inserted here by app.js -->
  </main>

  <p id="empty-state" class="empty-state" hidden>
    Your watchlist is empty. Add a ticker above to get started.
  </p>

  <script src="/static/app.js"></script>
</body>
</html>
