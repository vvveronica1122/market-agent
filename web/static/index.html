<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Agent</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Market<span>Agent</span></div>

      <form id="search-form" class="search" role="search">
        <input id="search-input" type="search" placeholder="Search ticker" autocomplete="off"
               maxlength="12" aria-label="Search for a ticker" />
      </form>

      <nav class="nav" aria-label="Main">
        <a class="nav-item" href="#/" data-route="home">Home</a>
        <p class="nav-section" id="nav-themes-label">Themes</p>
        <div class="nav-themes" id="nav-themes" aria-labelledby="nav-themes-label"></div>
        <p class="nav-section">Tools</p>
        <a class="nav-item" href="#/earnings" data-route="earnings">Earnings calendar</a>
        <a class="nav-item" href="#/discover" data-route="discover">Discover</a>
        <a class="nav-item" href="#/ask" data-route="ask">Ask</a>
      </nav>

      <p class="disclaimer">
        Delayed free market data, for research only. Nothing here is financial advice.
      </p>
    </aside>

    <div class="main">
      <header class="strip" id="market-strip" aria-label="Market overview">
        <div class="strip-loading">Loading market data...</div>
      </header>

      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
